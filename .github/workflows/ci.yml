name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        racket-version: ["9.0", "9.3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: ${{ matrix.racket-version }}
      # Deployment-tested Permit source, not a floating main.
      - name: Checkout pinned Permit source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turinglambdaai/permit.git "$RUNNER_TEMP/permit-src"
          git -C "$RUNNER_TEMP/permit-src" checkout --detach ed32d0eec463665e470657e54d222a1b98148a1e
          test "$(git -C "$RUNNER_TEMP/permit-src" rev-parse HEAD)" = "ed32d0eec463665e470657e54d222a1b98148a1e"
      - name: Install pinned Permit package
        shell: bash
        run: raco pkg install --auto --no-docs --name permit "$RUNNER_TEMP/permit-src"
      - name: Install package
        run: raco pkg install --auto --no-docs --name commerce "${{ github.workspace }}"
      - name: Compile
        run: raco make commerce/main.rkt commerce/provider.rkt commerce/journal.rkt commerce/storage.rkt commerce/storage/sqlite.rkt commerce/pancake.rkt commerce/permit.rkt commerce/issuer.rkt commerce/operator.rkt commerce/health.rkt commerce/log.rkt commerce/server.rkt commerce-doc/scribblings/commerce.scrbl
      - name: Test
        run: raco test -p commerce

  quality:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: "9.3"
      # Deployment-tested Permit source, not a floating main.
      - name: Checkout pinned Permit source
        shell: bash
        run: |
          git clone --no-checkout https://github.com/turinglambdaai/permit.git "$RUNNER_TEMP/permit-src"
          git -C "$RUNNER_TEMP/permit-src" checkout --detach ed32d0eec463665e470657e54d222a1b98148a1e
          test "$(git -C "$RUNNER_TEMP/permit-src" rev-parse HEAD)" = "ed32d0eec463665e470657e54d222a1b98148a1e"
      - name: Install pinned Permit package
        shell: bash
        run: raco pkg install --auto --no-docs --name permit "$RUNNER_TEMP/permit-src"
      - name: Install package with documentation
        run: raco pkg install --auto --name commerce "${{ github.workspace }}"
      - name: Check declared package dependencies
        run: raco setup --check-pkg-deps commerce
      - name: Build reference manual
        run: raco scribble --htmls --dest "${{ runner.temp }}/commerce-doc" commerce-doc/scribblings/commerce.scrbl
      - name: Run newcomer walkthrough
        run: racket examples/first-purchase.rkt
      - name: Require a clean generated tree
        run: git diff --exit-code


  latest-permit-compatibility:
    # Intentionally floating: proves compatibility, not release reproducibility.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          version: "9.3"
      - name: Install latest Permit package
        run: raco pkg install --auto --no-docs --name permit https://github.com/turinglambdaai/permit.git
      - name: Install Commerce package
        run: raco pkg install --auto --no-docs --name commerce "${{ github.workspace }}"
      - name: Test latest Permit integration
        run: raco test -p commerce

  docker-build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build service without live secrets
        run: docker build --pull -t commerce-ci -f deploy/Dockerfile .
